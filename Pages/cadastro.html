        </header>

        <main>
            <section aria-labelledby="titulo-cadastro" id="Conteiner-Cadastro">
                <h1 id="titulo-cadastro">Cadastro - EduTech</h1>
                <p>Crie sua conta (Interface Demonstrativa)</p>
                <form id="formCadastro" onsubmit="return false">
                <br>
                    <label for="nomeCadastro">Nome :</label>
                    <input id="nomeCadastro" name="nome" type="text" autocomplete="name" placeholder="Digite seu nome completo" required>
                <br>
                    <label for="emailCadastro">Email :</label>
                    <input id="emailCadastro" name="email" type="email" autocomplete="email" placeholder="nome@exemplo.com" required>
                <br>
                    <label for="senhaCadastro" name="senha">Senha :</label>
                    <input id="senhaCadastro" name="senha" type="password" minlength="8" autocomplete="new-password" placeholder="Digite sua senha" required>
                <br>
                    <label for="confirmarSenha" name="confirmarSenha">Confirmar sua senha :</label>
                    <input id="confirmarSenha" name="confirmarSenha" type="password" minlength="8" placeholder="Confirme sua senha" autocomplete="new-password" required>
                <br>
                    <button type="submit">Cadastrar</button>
                </form>
                <p>Já possui uma conta? <a href="login.html">Faça login</a></p>
                <p>Está página ainda não vai criar sua conta.</p>
                </section>
        </main>
